# Full application. The model Worker is opt-in: --profile inference.
# Generate local credentials first: python scripts/setup_env.py
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .env with scripts/setup_env.py}
      MYSQL_DATABASE: ${DB_NAME:-ailf_db}
      MYSQL_USER: ${DB_USER:-ailf}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Generate .env with scripts/setup_env.py}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-ailf}
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env with scripts/setup_env.py}
      DB_NAME: ${DB_NAME:-ailf_db}
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Generate .env with scripts/setup_env.py}
      DEVELOPER_PASSWORD: ${DEVELOPER_PASSWORD:?Generate .env with scripts/setup_env.py}
      DEBUG: "false"
      SEED_DEMO_USERS: "false"
      AI_COMMAND_MAX_CONCURRENT: ${AI_COMMAND_MAX_CONCURRENT:-2}
      AI_COMMAND_MAX_PENDING: ${AI_COMMAND_MAX_PENDING:-64}
      AI_COMMAND_TIMEOUT_SECONDS: ${AI_COMMAND_TIMEOUT_SECONDS:-540}
      AI_COMMAND_CACHE_SIZE: ${AI_COMMAND_CACHE_SIZE:-1024}
      REDIS_AI_TASK_TTL: ${REDIS_AI_TASK_TTL:-3600}
    ports: ["127.0.0.1:5000:5000"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["127.0.0.1:3000:3000"]

  worker:
    profiles: [inference]
    build:
      context: .
      dockerfile: Dockerfile.celery
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOCAL_MODEL_BASE_PATH: /app/Qwen/Qwen3-4B
      LOCAL_MODEL_LORA_PATH: /app/Model/checkpoint_epoch_2
      EMBEDDING_MODEL_PATH: /app/Model/bge-small-zh-v1.5
    volumes:
      - ./Qwen:/app/Qwen:ro
      - ./Model:/app/Model:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  mysql_data:
  redis_data:
